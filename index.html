<!DOCTYPE html>
<html lang="ru" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рустамова Махлиё Ахмаджоновна — Врач анестезиолог-реаниматолог, терапевт</title>
    <style>
        :root {
            --mayo-blue: #004b87;
            --mayo-dark: #002f56;
            --gold-accent: #ffd700;
            --gold-dark: #c5a000;
            --bg-light: #f4f9fd;
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Юридический дисклеймер сверху */
        .legal-top {
            background: linear-gradient(90deg, #fff3e0, #ffe0b2);
            color: #b78103;
            text-align: center;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 2px solid #ffe0b2;
            letter-spacing: 1px;
        }

        /* Навигационная панель */
        .mayo-header {
            background: var(--white);
            border-bottom: 2px solid #e2e8f0;
            padding: 22px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--mayo-blue); text-decoration: none; letter-spacing: -0.5px; }
        .logo-text span { color: var(--gold-dark); font-weight: 700; }
        .nav-links { display: flex; gap: 28px; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-weight: 700; font-size: 15px; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--mayo-blue); }

        /* Живые интерактивные кнопки с эффектом пульсации */
        .btn-mayo {
            display: inline-block;
            background: linear-gradient(135deg, var(--mayo-blue) 0%, var(--mayo-dark) 100%);
            color: var(--white);
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,75,135,0.3);
        }
        .btn-mayo:hover { 
            transform: translateY(-4px) scale(1.03); 
            box-shadow: 0 12px 28px rgba(0,75,135,0.45); 
        }
        
        .btn-gold {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold-accent) 0%, var(--gold-dark) 100%);
            color: var(--mayo-dark);
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212,175,55,0.4);
            animation: pulseGlow 2s infinite;
        }
        .btn-gold:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 28px rgba(212,175,55,0.6);
        }

        /* СЛАЙД 1: Главный баннер */
        .hero-section { background: linear-gradient(135deg, #f0f7fc 0%, var(--white) 100%); padding: 100px 0; }
        .hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 60px; align-items: center; }
        
        .hero-info h1 { 
            font-size: 46px; 
            color: var(--mayo-dark); 
            font-weight: 900; 
            line-height: 1.15; 
            margin-bottom: 20px;
            animation: fadeInReveal 1s ease-out;
        }
        .hero-info .subtitle { 
            font-size: 22px; 
            color: var(--mayo-blue); 
            font-weight: 700; 
            margin-bottom: 26px;
            border-left: 4px solid var(--gold-accent);
            padding-left: 12px;
        }
        .hero-info p { font-size: 18px; color: var(--text-muted); margin-bottom: 36px; max-width: 620px; }
        .hero-buttons { display: flex; gap: 20px; flex-wrap: wrap; }

        /* ЖИВАЯ АНИМАЦИЯ: Главное фото (1.JPG) непрерывно парит и дышит */
        .img-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,47,86,0.15);
            border: 6px solid var(--white);
            animation: floatLive 6s ease-in-out infinite;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .img-container:hover { 
            transform: scale(1.04) rotate(1deg); 
            box-shadow: 0 35px 70px rgba(0,47,86,0.25);
        }
        .main-photo { width: 100%; height: auto; display: block; aspect-ratio: 3/4; object-fit: cover; }

        /* СЛАЙД 2: Направления работы с 3D-всплытием */
        .services-section { padding: 100px 0; background: var(--white); }
        .section-title { text-align: center; font-size: 36px; color: var(--mayo-dark); font-weight: 900; margin-bottom: 12px; }
        .section-desc { text-align: center; color: var(--text-muted); font-size: 18px; margin-bottom: 60px; }
        
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .service-card { 
            background: var(--bg-light); 
            padding: 45px 35px; 
            border-radius: 12px; 
            border-top: 5px solid var(--mayo-blue); 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .service-card:hover { 
            transform: translateY(-10px); 
            background: var(--white);
            border-top-color: var(--gold-accent);
            box-shadow: 0 20px 40px rgba(0,75,135,0.12); 
        }
        .service-card h3 { color: var(--mayo-dark); font-size: 22px; margin-bottom: 16px; font-weight: 800; }
        .service-card p { color: var(--text-muted); font-size: 16px; }

        /* СЛАЙД 3: Ваша расширенная анимированная фотогалерея со всеми фото (2.JPG - 6.JPG) */
        .gallery-section { padding: 100px 0; background: var(--bg-light); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .gallery-item { 
            overflow: hidden; 
            border-radius: 14px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.06); 
            border: 6px solid var(--white); 
            background: var(--white);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .gallery-item img { width: 100%; height: 340px; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,47,86,0.22);
            border-color: var(--gold-accent);
        }
        .gallery-item:hover img { transform: scale(1.1); }

        /* Блок отзывов пациентов */
        .reviews-section { padding: 100px 0; background: var(--white); }
        .reviews-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .review-card { background: var(--bg-light); padding: 40px; border-radius: 12px; border-left: 6px solid var(--mayo-blue); transition: border-color 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .review-card:hover { border-left-color: var(--gold-accent); }
        .review-card p { font-style: italic; color: var(--text-main); font-size: 16px; margin-bottom: 20px; line-height: 1.7; }
        .review-card .author { font-weight: 800; color: var(--mayo-dark); display: flex; justify-content: space-between; font-size: 16px; }
        .stars { color: var(--gold-dark); letter-spacing: 2px; }

        /* Финальный блок записи */
        .cta-block { 
            background: linear-gradient(135deg, var(--mayo-dark) 0%, #005691 100%); 
            color: var(--white); 
            padding: 80px 40px; 
            border-radius: 16px; 
            text-align: center; 
            margin: 50px 0;
            box-shadow: 0 25px 55px rgba(0,47,86,0.3);
        }
        .cta-block h2 { font-size: 38px; font-weight: 900; margin-bottom: 16px; color: var(--white); }
        .cta-block p { opacity: 0.95; font-size: 19px; margin-bottom: 35px; }
        .cta-flex { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        /* Юридический подвал */
        footer { background: #0f172a; color: #94a3b8; padding: 70px 0 40px 0; }
        .footer-warning { border: 2px dashed #334155; padding: 22px; text-align: center; color: #cbd5e1; font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 35px; border-radius: 8px; line-height: 1.5; }
        .footer-text { font-size: 14px; line-height: 1.7; text-align: center; max-width: 1020px; margin: 0 auto 35px auto; opacity: 0.8; }
        .copyright { text-align: center; font-size: 13px; border-top: 1px solid #1e293b; padding-top: 25px; color: #64748b; }

        /* ТЕХНИЧЕСКИЕ CSS АНИМАЦИИ */
        @keyframes fadeInReveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatLive {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
