<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рустамова Махлиё Ахмаджоновна — врач анестезиолог-реаниматолог, терапевт, IV-терапия</title>
    <style>
        :root {
            --bg-main: #f4f9fa;
            --mint-light: #e0f2f1;
            --ink: #112233;
            --muted: #4b6572;
            --accent: #1c7a8c;
            --accent-dark: #114b5f;
            --white: #ffffff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--ink);
            background-color: var(--bg-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .wrap { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

        /* Юридическая защита по ФЗ «О Рекламе» */
        .legal-top-warning {
            background: #fff3e0;
            color: #b78103;
            text-align: center;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid #ffe0b2;
            position: relative;
            z-index: 100;
        }

        /* Премиальные кнопки с микро-анимацией покачивания */
        .btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(28,122,140,0.1);
        }
        .btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 12px 24px rgba(28,122,140,0.25); 
        }
        .btn:active { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); color: #fff; }
        .btn-outline { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
        .btn-outline:hover { background: var(--mint-light); }

        /* ЭФФЕКТ СЛАЙДЕРА: Разделение на полноценные независимые экраны */
        .slide-screen {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: 80px 0;
            position: relative;
            border-bottom: 1px solid #e1eff2;
        }

        /* ЭКРАН 1: Приветственный слайд в стиле Premium Medical */
        .slide-hero {
            background: linear-gradient(135deg, #eef7f9 0%, #ffffff 50%, #f4f9fa 100%);
        }
        .hero-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: center; width: 100%; }
        
        /* Живое плавное появление текста слева направо */
        .hero-text h1 { 
            font-size: 46px; 
            color: var(--accent-dark); 
            margin-bottom: 15px; 
            line-height: 1.2; 
            font-weight: 800;
            animation: slideInLeft 1s ease-out forwards;
        }
        .hero-text .role { 
            font-size: 21px; 
            color: var(--accent); 
            margin-bottom: 24px; 
            font-weight: 600;
            animation: slideInLeft 1.2s ease-out forwards;
        }
        .hero-text .lead { 
            font-size: 18px; 
            color: var(--muted); 
            margin-bottom: 35px; 
            line-height: 1.7;
            animation: slideInLeft 1.4s ease-out forwards;
        }
        .cta-block { display: flex; gap: 16px; flex-wrap: wrap; animation: fadeIn 2s ease-out forwards; }

        /* ЖИВАЯ АНИМАЦИЯ: Главное фото покачивается и дышит */
        .photo-frame-live {
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 55px rgba(17,75,95,0.18);
            border: 8px solid var(--white);
            animation: floatAnimation 6s ease-in-out infinite; /* Эффект парения в воздухе */
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }
        .photo-frame-live:hover {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 35px 70px rgba(17,75,95,0.28);
        }
        .photo-img { width: 100%; height: auto; object-fit: cover; aspect-ratio: 3/4; display: block; }

        /* ЭКРАН 2: Экспертный блок (Интерактивные карточки) */
        .slide-features {
            background: linear-gradient(135deg, var(--white) 0%, #eef7f9 100%);
        }
        .slide-title { font-size: 36px; color: var(--accent-dark); text-align: center; margin-bottom: 12px; font-weight: 700; }
        .slide-subtitle { text-align: center; color: var(--muted); margin-bottom: 55px; font-size: 18px; }
        
        .grid-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; width: 100%; }
        
        /* Интерактивное всплытие карточек при наведении */
        .feature-card { 
            background: var(--white); 
            border-radius: 24px; 
            padding: 40px 30px; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            text-align: center; 
            border: 1px solid rgba(28,122,140,0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        .feature-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(28,122,140,0.12);
            border-color: var(--accent);
        }
        .feature-card .icon { font-size: 46px; display: block; margin-bottom: 20px; transition: transform 0.3s ease; }
        .feature-card:hover .icon { transform: scale(1.2) rotate(5deg); }
        .feature-card h3 { color: var(--accent); font-size: 22px; margin-bottom: 14px; font-weight: 700; }
        .feature-card p { color: var(--muted); font-size: 15px; line-height: 1.6; }

        /* ЭКРАН 3: Живая фотогалерея ваших процедур */
        .slide-gallery {
            background: linear-gradient(135deg, #f4f9fa 0%, var(--white) 100%);
        }
        .gallery-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; }
        
        /* Эффект 3D-приближения фотографий в галерее */
        .gallery-box-live { 
            overflow: hidden; 
            border-radius: 22px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.07); 
            border: 6px solid var(--white);
            background: var(--white);
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .gallery-box-live img { 
            width: 100%; 
            height: 320px; 
            object-fit: cover; 
            display: block; 
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        }
        .gallery-box-live:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(17,75,95,0.15);
        }
        .gallery-box-live:hover img { 
            transform: scale(1.12); /* Плавный наезд камеры на фото */
        }

        /* Отзывы пациентов */
        .reviews-section { padding: 90px 0; background: var(--white); }
        .reviews-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .review-item { background: var(--bg-main); padding: 35px; border-radius: 20px; border-left: 6px solid var(--accent); box-shadow: 0 5px 15px rgba(0,0,0,0.01); }
        .review-text { font-style: italic; color: var(--ink); margin-bottom: 20px; font-size: 16px; line-height: 1.7; }
        .review-user { font-weight: bold; display: flex; justify-content: space-between; color: var(--accent-dark); font-size: 16px; }
        .stars { color: #ffb300; letter-spacing: 2px; }

        /* Финальный фиксированный слайд записи */
        .slide-footer-cta {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
            color: var(--white);
            text-align: center;
            padding: 80px 40px;
            border-radius: 32px;
            margin: 40px auto;
            max-width: 1140px;
            box-shadow: 0 20px 50px rgba(17,75,95,0.25);
        }
        .slide-footer-cta h2 { color: var(--white); font-size: 40px; margin-bottom: 15px; font-weight: 800; }
        .slide-footer-cta p { opacity: 0.95; font-size: 19px; margin-bottom: 35px; }
        .slide-footer-cta .buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .slide-footer-cta .btn-outline { color: var(--white); border-color: var(--white); background: transparent; }
        .slide-footer-cta .btn-outline:hover { background: rgba(255,255,255,0.15); }

        /* Юридический блок защиты клиники */
        footer { padding: 60px 0; text-align: center; color: var(--muted); background: var(--white); border-top: 1px solid #eef2f5; }
        .warning-text { font-size: 17px; font-weight: 800; text-transform: uppercase; color: #5a6b7b; letter-spacing: 2px; margin-bottom: 30px; border: 2px dashed #cbd5e1; padding: 18px; border-radius: 12px; line-height: 1.5; }

        /* ТЕХНИЧЕСКИЕ CSS3 АНИМАЦИИ ДВИЖЕНИЯ */
        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); } /* Фото "дышит" вверх-вниз на 15 пикселей */
            100% { transform: translateY(0px); }
        }

        /* Адаптивность под мобильные телефоны */
        @media(max-width: 900px) {
            .hero-grid, .grid-features, .gallery-container, .reviews-grid { grid-template-columns: 1fr; }
